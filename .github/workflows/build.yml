# Builds and tests every push. A pushed tag such as v1.0.0 also publishes a release with
# HonQueueNotifier.exe attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check that the tag matches the program's version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $csproj = Get-Content src/HonQueueNotifier/HonQueueNotifier.csproj -Raw
          $version = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in HonQueueNotifier.csproj." }

      - name: Build
        run: dotnet build HonQueueNotifier.sln -c Release --nologo

      - name: Test
        run: dotnet test HonQueueNotifier.sln -c Release --no-build --nologo

      - uses: actions/upload-artifact@v7
        with:
          name: HonQueueNotifier
          path: src/HonQueueNotifier/bin/Release/net48/HonQueueNotifier.exe

      # The exe keeps the same name in every release, so the README links straight to the latest one.
      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" src/HonQueueNotifier/bin/Release/net48/HonQueueNotifier.exe
          --title "HoN Queue Notifier ${{ github.ref_name }}"
          --notes "Download HonQueueNotifier.exe and run it."
